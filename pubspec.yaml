name: maiyen_app
description: "MaiYen smart home safety and security application."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_database: ^11.3.10
  audioplayers: 5.2.1
  firebase_auth: ^5.7.0
  mobile_scanner: ^7.2.0
  reorderables: ^0.6.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  firebase_storage: ^12.4.10
  flutter_secure_storage: ^10.0.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  native_geofence: ^1.3.1
  geolocator: ^14.0.3
  emoji_picker_flutter: ^3.1.0
  firebase_app_check: ^0.3.2+10
  flutter_foreground_task: ^9.2.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#167D5A"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/maiyen_splash.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: assets/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.mp3
    - assets/login.png
    - assets/login1.png
    - assets/login2.png
    - assets/maiyen_mark.png
    - assets/maiyen_logo.png
    - assets/maiyen_splash.png