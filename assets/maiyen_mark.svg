<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="roof" x1="150" y1="260" x2="830" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#064A40"/>
      <stop offset="0.58" stop-color="#075B47"/>
      <stop offset="1" stop-color="#79BE43"/>
    </linearGradient>
    <linearGradient id="leaf" x1="310" y1="875" x2="910" y2="330" gradientUnits="userSpaceOnUse">
